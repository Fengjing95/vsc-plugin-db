name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    # 评审 P2-3：契约测试 CI 矩阵——Redis 契约需真实实例（6379 常规 service + 6390 认证实例由
    # 「起 Redis 认证实例」步骤自起，P-52 双坑：service options 不能带 --requirepass）；
    # M8-PG：PostgreSQL 契约（本地无实例，PG_HOST 门控 skip / CI 实跑，驱动规范 §11）；
    # M8-Mongo：MongoDB 契约（MONGO_URI 门控同 PG 口径；mongo:7 自带 mongosh 供 health 探测）
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      postgres:
        image: postgres:16
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand(\"ping\").ok'"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 10
      # 发布准备批次：MySQL 契约（MYSQL_HOST 门控同 PG/MONGO 口径；此前仅生成层单测）
      mysql:
        image: mysql:8
        ports:
          - 3306:3306
        env:
          MYSQL_ROOT_PASSWORD: root
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 30
      # M8-MSSQL：SQL Server 契约（MSSQL_HOST 门控同 PG/MONGO/MYSQL 口径）。service 只放 env
      # （ACCEPT_EULA + SA 密码满足复杂度：四类中三类）；启动含内部初始化且可能重启循环（P-52
      # 同款「service 不承担应用层就绪判定」），就绪探测交给下方「等待 SQL Server 就绪」步骤
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        ports:
          - 1433:1433
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: C0ntract!2026
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 类型检查
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: 构建
        run: pnpm build

      # 官网并入门禁（typecheck/lint 经根脚本已覆盖）；P-55：--filter 空转防复发，构建后断言产物
      - name: 构建官网
        run: |
          pnpm --filter db-kit-website build
          test -f website/dist/index.html

      # 错误密码用例（E_AUTH）的认证实例：service options 只接受 docker create 旗标，
      # --requirepass（redis-server 参数）会让 create exit 125（P-52）；bitnami 版本 tag 又因
      # Broadcom 收紧目录已删（manifest unknown，P-52 双坑）→ 测试前一步自起，
      # 与常规 service 同一个 redis:7 镜像（host 网络直听 6390）
      - name: 起 Redis 认证实例（E_AUTH，:6390）
        run: |
          docker run -d --name redis-auth --network host redis:7 \
            redis-server --port 6390 --requirepass m6cipass --save "" --appendonly no
          for i in $(seq 1 30); do
            if docker exec redis-auth redis-cli -a m6cipass -p 6390 ping 2>/dev/null | grep -q PONG; then
              echo "redis-auth ready"
              break
            fi
            sleep 1
          done

      # SQL Server 启动就绪探测（约 20~60s，偶发内部重启循环）：sqlcmd 轮询直到可登录。
      # tools18/-C（信任自签证书）与旧 tools 路径双兼容；容器经镜像 ancestor 定位
      - name: 等待 SQL Server 就绪（sqlcmd 探活）
        run: |
          CID=$(docker ps --filter "ancestor=mcr.microsoft.com/mssql/server:2022-latest" --format '{{.ID}}' | head -1)
          if [ -z "$CID" ]; then
            echo "::error::未找到 mssql service 容器"
            exit 1
          fi
          for i in $(seq 1 48); do
            if docker exec "$CID" bash -c \
              "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P 'C0ntract!2026' -Q 'SELECT 1' -b -o /dev/null 2>/dev/null || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P 'C0ntract!2026' -Q 'SELECT 1' -b -o /dev/null 2>/dev/null"; then
              echo "mssql ready（第 ${i} 次探测，间隔 5s）"
              exit 0
            fi
            sleep 5
          done
          echo "::error::SQL Server 240s 内未就绪"
          docker logs "$CID" 2>&1 | tail -50
          exit 1

      - name: 测试（含 Redis / PostgreSQL / MongoDB / MySQL / SQL Server 契约）
        run: |
          set -o pipefail
          pnpm test 2>&1 | tee /tmp/vitest-output.txt
        env:
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: 6379
          REDIS_AUTH_PORT: 6390
          PG_HOST: 127.0.0.1
          PG_PORT: 5432
          PG_USER: postgres
          PG_PASSWORD: postgres
          PG_DATABASE: postgres
          MONGO_URI: mongodb://127.0.0.1:27017
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: 3306
          MYSQL_USER: root
          MYSQL_PASSWORD: root
          MSSQL_HOST: 127.0.0.1
          MSSQL_PORT: 1433
          MSSQL_USER: sa
          MSSQL_PASSWORD: C0ntract!2026
          MSSQL_DATABASE: cf_test

      # Actions 日志需登录才可见，而运行摘要（Summary 页）与注记 API 匿名可读——失败时把
      # vitest 输出尾部写入摘要，并按 ::error:: 注记分块输出（每块 25 行 <4KB 上限），
      # 供无凭据的远程诊断（发布准备批次；配合契约 logFailures 注记）
      - name: 失败输出转运行摘要与注记
        if: failure()
        run: |
          {
            echo '## 测试失败输出（vitest 尾部 300 行）'
            echo '<details open><summary>展开</summary>'
            echo ''
            echo '```text'
            tail -n 300 /tmp/vitest-output.txt 2>/dev/null || echo '（无输出文件）'
            echo '```'
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -f /tmp/vitest-output.txt ]; then
            tail -n 150 /tmp/vitest-output.txt > /tmp/tail.txt
            echo "::error::vitest 输出尾部共 $(wc -l < /tmp/tail.txt | tr -d ' ') 行，分块见后续注记（另有 artifact vitest-output）"
            split -l 25 /tmp/tail.txt /tmp/chunk_
            for f in /tmp/chunk_*; do
              echo "::error::$(sed 's/%/%25/g; s/\r/%0D/g; :a;N;$!ba;s/\n/%0A/g' "$f")"
            done
            rm -f /tmp/chunk_*
          fi

      - name: 上传测试输出（诊断 artifact）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: vitest-output
          path: /tmp/vitest-output.txt
          retention-days: 7
          if-no-files-found: ignore
