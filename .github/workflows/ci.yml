name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    # 评审 P2-3：契约测试 CI 矩阵——Redis 契约需真实实例（6379 常规 service + 6390 认证实例由
    # 「起 Redis 认证实例」步骤自起，P-52 双坑：service options 不能带 --requirepass）；
    # M8-PG：PostgreSQL 契约（本地无实例，PG_HOST 门控 skip / CI 实跑，驱动规范 §11）；
    # M8-Mongo：MongoDB 契约（MONGO_URI 门控同 PG 口径；mongo:7 自带 mongosh 供 health 探测）
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      postgres:
        image: postgres:16
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand(\"ping\").ok'"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 10
      # 发布准备批次：MySQL 契约（MYSQL_HOST 门控同 PG/MONGO 口径；此前仅生成层单测）
      mysql:
        image: mysql:8
        ports:
          - 3306:3306
        env:
          MYSQL_ROOT_PASSWORD: root
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 类型检查
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: 构建
        run: pnpm build

      # 错误密码用例（E_AUTH）的认证实例：service options 只接受 docker create 旗标，
      # --requirepass（redis-server 参数）会让 create exit 125（P-52）；bitnami 版本 tag 又因
      # Broadcom 收紧目录已删（manifest unknown，P-52 双坑）→ 测试前一步自起，
      # 与常规 service 同一个 redis:7 镜像（host 网络直听 6390）
      - name: 起 Redis 认证实例（E_AUTH，:6390）
        run: |
          docker run -d --name redis-auth --network host redis:7 \
            redis-server --port 6390 --requirepass m6cipass --save "" --appendonly no
          for i in $(seq 1 30); do
            if docker exec redis-auth redis-cli -a m6cipass -p 6390 ping 2>/dev/null | grep -q PONG; then
              echo "redis-auth ready"
              break
            fi
            sleep 1
          done

      - name: 测试（含 Redis / PostgreSQL / MongoDB / MySQL 契约）
        run: pnpm test
        env:
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: 6379
          REDIS_AUTH_PORT: 6390
          PG_HOST: 127.0.0.1
          PG_PORT: 5432
          PG_USER: postgres
          PG_PASSWORD: postgres
          PG_DATABASE: postgres
          MONGO_URI: mongodb://127.0.0.1:27017
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: 3306
          MYSQL_USER: root
          MYSQL_PASSWORD: root
