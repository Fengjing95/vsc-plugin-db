# DB Kit 产品官网（website/）→ GitHub Pages
# 产物地址：https://fengjing95.github.io/vsc-plugin-db/
# 首次运行若报 Pages 未启用：仓库 Settings → Pages → Source 选「GitHub Actions」
# （configure-pages 的 enabled: true 也会尝试自动开启）
name: Website (GitHub Pages)

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'docs/images/**'
      - 'packages/webview-ui/src/assets/logos/**'
      - 'packages/extension/media/extension-icon.svg'
      - '.github/workflows/website-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      # P-55：--filter 对不存在的包名静默 no-op（exit 0），构建后断言产物存在
      - name: 构建官网
        run: |
          pnpm --filter db-kit-website build
          test -f website/dist/index.html

      - name: 配置 Pages
        uses: actions/configure-pages@v5
        with:
          enabled: true

      - name: 上传产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: website/dist

      - id: deployment
        uses: actions/deploy-pages@v4
