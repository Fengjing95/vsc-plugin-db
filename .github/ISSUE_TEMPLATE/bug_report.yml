name: Bug 反馈 / Bug report
description: 报告一个可复现的错误或异常行为 / Report a reproducible error or unexpected behavior
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        反馈前请确认：扩展已升级到最新版本，且问题可以复现。
        ⚠️ 日志与截图请先脱敏——不要包含密码、连接串与真实业务数据。
        Before filing: please update to the latest version and confirm the issue reproduces.
        ⚠️ Redact logs and screenshots — never include passwords, connection strings, or real business data.
  - type: textarea
    id: what-happened
    attributes:
      label: 问题描述 / What happened?
      description: 发生了什么？你期望发生什么？/ What did you expect to happen instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤 / Steps to reproduce
      description: 从新建连接开始，逐步描述如何复现（涉及的 SQL 请一并提供）。/ Describe step by step, starting from creating a connection (include any SQL involved).
      placeholder: |
        1. 新建 MySQL 连接 … / Create a MySQL connection …
        2. 打开表 … / Open the table …
        3. 双击单元格 … / Double-click a cell …
        4. 出现报错：… / Error: …
    validations:
      required: true
  - type: dropdown
    id: engine
    attributes:
      label: 数据源类型 / Engine
      options:
        - MySQL
        - PostgreSQL
        - SQL Server
        - Oracle
        - SQLite
        - MongoDB
        - Redis
        - Mock（内置演示数据源 / built-in demo data source）
        - 其他 / Other
    validations:
      required: true
  - type: textarea
    id: env
    attributes:
      label: 环境信息 / Environment
      description: VSCode 版本（帮助 → 关于）、DB Kit 版本（扩展面板可见）、操作系统。/ VSCode version (Help → About), DB Kit version (Extensions panel), operating system.
      placeholder: |
        - VSCode：1.9x
        - DB Kit：v0.5.0
        - 系统 / OS：macOS / Windows / Linux …
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 日志与截图 / Logs and screenshots
      description: 「输出」面板选择「DB Kit」复制的日志（请先脱敏），或错误截图。/ Logs copied from the Output panel ("DB Kit" channel, redacted), or error screenshots.
    validations:
      required: false
